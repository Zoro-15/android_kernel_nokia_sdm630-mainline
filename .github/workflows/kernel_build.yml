name: Build Nokia 6.1 (PL2) Mainline GSI Boot Image

on:
  workflow_dispatch:
  push:
    branches:
      - gsi-boot

permissions:
  contents: write

jobs:
  build:
    name: Build Mainline Kernel & Assemble GSI Boot Image
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Build Dependencies
        run: |
          sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=30
          sudo apt-get install -y -o Acquire::Retries=3 -o Acquire::http::Timeout=30 \
            bc bison flex libssl-dev libelf-dev lz4 gcc-aarch64-linux-gnu

      - name: Build Kernel (Image.gz & sdm630-nokia-pl2.dtb)
        run: |
          set -e -x -o pipefail
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export KCFLAGS="-Wno-error"

          # Configure with sdm660_defconfig
          make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- sdm660_defconfig

          # Compile Image.gz and sdm630-nokia-pl2.dtb
          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            KCFLAGS="-Wno-error" \
            Image.gz qcom/sdm630-nokia-pl2.dtb 2>&1 | tee build.log

      - name: Assemble Image.gz-dtb and Prepare Artifacts
        run: |
          mkdir -p artifacts

          # Verify build products
          if [ ! -f out/arch/arm64/boot/Image.gz ]; then
            echo "ERROR: out/arch/arm64/boot/Image.gz not found!" && exit 1
          fi
          if [ ! -f out/arch/arm64/boot/dts/qcom/sdm630-nokia-pl2.dtb ]; then
            echo "ERROR: out/arch/arm64/boot/dts/qcom/sdm630-nokia-pl2.dtb not found!" && exit 1
          fi

          # Concatenate kernel and DTB into Image.gz-dtb
          cat out/arch/arm64/boot/Image.gz out/arch/arm64/boot/dts/qcom/sdm630-nokia-pl2.dtb > artifacts/Image.gz-dtb

          echo "Kernel and DTB assembled successfully:"
          ls -lh artifacts/Image.gz-dtb

      - name: Package Flashable boot.img with mkbootimg (Header v0)
        run: |
          # Fetch self-contained LineageOS mkbootimg tool
          curl -sL https://raw.githubusercontent.com/LineageOS/android_system_tools_mkbootimg/lineage-18.1/mkbootimg.py -o mkbootimg.py

          # Prepare minimal ramdisk
          if [ -f "prebuilts/ramdisk.cpio" ]; then
            echo "Using custom ramdisk from prebuilts/ramdisk.cpio..."
            cp prebuilts/ramdisk.cpio ramdisk.cpio
          else
            echo "ERROR: prebuilts/ramdisk.cpio not found! A genuine First-Stage Init ramdisk is required for GSI boot."
            exit 1
          fi

          # CMDLINE from device-nokia-pl2mainline/BoardConfig.mk
          CMDLINE="androidboot.boot_devices=soc@0/c0c4000.mmc,soc/c0c4000.sdhci,c0c4000.mmc androidboot.hardware=nokia-pl2 androidboot.force_normal_boot=1 androidboot.selinux=permissive androidboot.verifiedbootstate=orange androidboot.usbcontroller=a800000.usb earlycon console=tty0 console=ttyMSM0,115200n8 clk_ignore_unused pd_ignore_unused cpuidle.off=1 firmware_class.path=/vendor/firmware/"

          # Package boot.img: Header v0 (Mandatory for Nokia 6.1 Little Kernel aboot)
          # Uses concatenated Image.gz-dtb
          python3 mkbootimg.py \
            --kernel artifacts/Image.gz-dtb \
            --ramdisk ramdisk.cpio \
            --base 0x00000000 \
            --pagesize 4096 \
            --kernel_offset 0x00008000 \
            --ramdisk_offset 0x01000000 \
            --tags_offset 0x00000100 \
            --header_version 0 \
            --cmdline "$CMDLINE" \
            --os_version 10.0.0 \
            --os_patch_level 2026-10 \
            -o artifacts/boot.img

          if [ ! -s "artifacts/boot.img" ]; then
            echo "ERROR: Failed to produce artifacts/boot.img!" && exit 1
          fi

          echo "Generated flashable boot.img:"
          ls -lh artifacts/boot.img

      - name: Extract & Display Build Errors
        if: failure()
        run: |
          mkdir -p build_logs
          echo "### ❌ Build Failed — Error Summary" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          if [ -f build.log ]; then
            grep -iE "error:|fatal error:|recipe for target.*failed" build.log | tail -n 50 > build_logs/errors_summary.txt || true
            cat build_logs/errors_summary.txt >> $GITHUB_STEP_SUMMARY
            gzip -c build.log > build_logs/build.log.gz
          else
            echo "No build.log found" > build_logs/errors_summary.txt
            cat build_logs/errors_summary.txt >> $GITHUB_STEP_SUMMARY
          fi
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload Build Log Artifacts on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-logs
          path: build_logs/

      - name: Upload Boot Image Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Nokia-PL2-Mainline-GSI-BootImage
          path: artifacts/boot.img

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: PL2-mainline-gsi-boot-v${{ github.run_number }}
          name: Nokia 6.1 (PL2) Mainline GSI Boot Image #${{ github.run_number }}
          body: |
            ## Nokia 6.1 (PL2) Mainline GSI Boot Image #${{ github.run_number }}

            Target: Qualcomm Snapdragon 630 (`sdm630`) — HMD Global Nokia 6.1 (`PL2_mainline`).
            Kernel: Linux Mainline (branch `${{ github.ref_name }}`, commit `${{ github.sha }}`).

            ### Artifact:
            - **`boot.img`**: Raw Android Boot Image for GSI Bringup (Header Version 0, Page Size 4096, cmdline configured for `sdm630-nokia-pl2`).
              - Flash command (Slot B ONLY): `fastboot flash boot_b boot.img`
          files: |
            artifacts/boot.img
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
