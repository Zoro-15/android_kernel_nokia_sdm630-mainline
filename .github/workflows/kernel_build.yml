name: Build Nokia 6.1 (PL2) Mainline Kernel & Boot Image

on:
  workflow_dispatch:
  push:
    branches:
      - ci-build

permissions:
  contents: write

jobs:
  build:
    name: Build Mainline Kernel & Assemble Boot Image
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Build Dependencies
        run: |
          sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=30
          sudo apt-get install -y -o Acquire::Retries=3 -o Acquire::http::Timeout=30 \
            bc bison flex libssl-dev libelf-dev lz4 gcc-aarch64-linux-gnu

      - name: Build Kernel (Image.gz & sdm630-nokia-pl2.dtb)
        run: |
          set -e -x -o pipefail
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export KCFLAGS="-Wno-error"

          # Configure with sdm660_defconfig
          make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- sdm660_defconfig

          # Compile Image.gz and sdm630-nokia-pl2.dtb
          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            KCFLAGS="-Wno-error" \
            Image.gz qcom/sdm630-nokia-pl2.dtb 2>&1 | tee build.log

      - name: Assemble Image.gz-dtb and Prepare Artifacts
        run: |
          mkdir -p artifacts

          # Verify build products
          if [ ! -f out/arch/arm64/boot/Image.gz ]; then
            echo "ERROR: out/arch/arm64/boot/Image.gz not found!" && exit 1
          fi
          if [ ! -f out/arch/arm64/boot/dts/qcom/sdm630-nokia-pl2.dtb ]; then
            echo "ERROR: out/arch/arm64/boot/dts/qcom/sdm630-nokia-pl2.dtb not found!" && exit 1
          fi

          # Concatenate kernel and DTB into Image.gz-dtb
          cat out/arch/arm64/boot/Image.gz out/arch/arm64/boot/dts/qcom/sdm630-nokia-pl2.dtb > artifacts/Image.gz-dtb

          cp out/arch/arm64/boot/Image.gz artifacts/Image.gz
          cp out/arch/arm64/boot/dts/qcom/sdm630-nokia-pl2.dtb artifacts/sdm630-nokia-pl2.dtb

          echo "Kernel and DTB assembled successfully:"
          ls -lh artifacts/

      - name: Package AnyKernel3 Flashable Package
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          sed -i 's/device.name1=.*/device.name1=PL2/g' AnyKernel3/anykernel.sh
          sed -i 's/device.name2=.*/device.name2=PL2_sprout/g' AnyKernel3/anykernel.sh
          sed -i 's/device.name3=.*/device.name3=B2N/g' AnyKernel3/anykernel.sh
          sed -i 's/device.name4=.*/device.name4=B2N_sprout/g' AnyKernel3/anykernel.sh
          sed -i 's/device.name5=.*/device.name5=Plate2/g' AnyKernel3/anykernel.sh

          cp artifacts/Image.gz-dtb AnyKernel3/Image.gz-dtb
          cp artifacts/sdm630-nokia-pl2.dtb AnyKernel3/dtb || true

          cd AnyKernel3
          zip -r9 ../artifacts/Nokia_PL2_Mainline-Kernel.zip * -x .git README.md
          cd ..

      - name: Package Flashable boot.img with mkbootimg (Header v2)
        run: |
          # Fetch self-contained LineageOS mkbootimg tool
          curl -sL https://raw.githubusercontent.com/LineageOS/android_system_tools_mkbootimg/lineage-18.1/mkbootimg.py -o mkbootimg.py

          # Use prebuilt recovery ramdisk if present
          if [ -f "prebuilts/ramdisk.cpio" ]; then
            echo "Using prebuilt recovery ramdisk from prebuilts/ramdisk.cpio..."
            cp prebuilts/ramdisk.cpio ramdisk.cpio
          elif [ -f "prebuilts/boot24.img" ] || [ -f "prebuilts/boot.img" ]; then
            BASE_IMG=$(ls prebuilts/boot24.img prebuilts/boot.img 2>/dev/null | head -n 1)
            echo "Found base boot image: $BASE_IMG, extracting ramdisk..."
            curl -sL https://raw.githubusercontent.com/LineageOS/android_system_tools_mkbootimg/lineage-18.1/unpack_bootimg.py -o unpack_bootimg.py || true
            if [ -f "unpack_bootimg.py" ]; then
              python3 unpack_bootimg.py --boot_img "$BASE_IMG" --out unpacked_boot || true
              if [ -f "unpacked_boot/ramdisk" ]; then
                cp unpacked_boot/ramdisk ramdisk.cpio
              fi
            fi
          fi

          if [ ! -f "ramdisk.cpio" ] || [ ! -s "ramdisk.cpio" ]; then
            echo "Creating stub cpio ramdisk..."
            mkdir -p rd
            touch rd/placeholder
            (cd rd && find . | cpio -o -H newc > ../ramdisk.cpio)
            rm -rf rd
          fi

          # CMDLINE from device-nokia-pl2mainline/BoardConfig.mk
          CMDLINE="androidboot.boot_devices=soc@0/c0c4000.mmc,soc/c0c4000.sdhci,c0c4000.mmc androidboot.hardware=nokia-pl2 androidboot.selinux=permissive androidboot.verifiedbootstate=orange androidboot.usbcontroller=a800000.dwc3 earlycon console=tty0 console=ttyMSM0,115200n8 clk_ignore_unused pd_ignore_unused firmware_class.path=/vendor/firmware/"

          # Package boot.img: Header v0 (Mandatory for Nokia 6.1 Little Kernel aboot)
          # Uses concatenated Image.gz-dtb
          python3 mkbootimg.py \
            --kernel artifacts/Image.gz-dtb \
            --ramdisk ramdisk.cpio \
            --base 0x00000000 \
            --pagesize 4096 \
            --kernel_offset 0x00008000 \
            --ramdisk_offset 0x01000000 \
            --tags_offset 0x00000100 \
            --header_version 0 \
            --cmdline "$CMDLINE" \
            --os_version 10.0.0 \
            --os_patch_level 2026-10 \
            -o artifacts/boot.img

          if [ ! -s "artifacts/boot.img" ]; then
            echo "ERROR: Failed to produce artifacts/boot.img!" && exit 1
          fi

          echo "Generated flashable boot.img:"
          ls -lh artifacts/boot.img

      - name: Extract & Display Build Errors
        if: failure()
        run: |
          mkdir -p build_logs
          echo "### ❌ Build Failed — Error Summary" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          if [ -f build.log ]; then
            grep -iE "error:|fatal error:|recipe for target.*failed" build.log | tail -n 50 > build_logs/errors_summary.txt || true
            cat build_logs/errors_summary.txt >> $GITHUB_STEP_SUMMARY
            gzip -c build.log > build_logs/build.log.gz
          else
            echo "No build.log found" > build_logs/errors_summary.txt
            cat build_logs/errors_summary.txt >> $GITHUB_STEP_SUMMARY
          fi
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload Build Log Artifacts on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-logs
          path: build_logs/

      - name: Upload Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Nokia-PL2-Mainline-Artifacts
          path: |
            artifacts/boot.img
            artifacts/Image.gz-dtb
            artifacts/Image.gz
            artifacts/sdm630-nokia-pl2.dtb
            artifacts/Nokia_PL2_Mainline-Kernel.zip
            build.log

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: PL2-mainline-v${{ github.run_number }}
          name: Nokia 6.1 (PL2) Mainline Kernel & Boot Image #${{ github.run_number }}
          body: |
            ## Nokia 6.1 (PL2) Mainline Kernel CI Build #${{ github.run_number }}

            Target: Qualcomm Snapdragon 630 (`sdm630`) — HMD Global Nokia 6.1 (`PL2_mainline`).
            Kernel: Linux Mainline (branch `${{ github.ref_name }}`, commit `${{ github.sha }}`).

            ### Artifacts Included:
            - **`boot.img`**: Flashable Android Boot Image (Header Version 0, Base 0x00000000, Pagesize 4096, Ramdisk offset 0x01000000, cmdline configured for `sdm630-nokia-pl2`).
              - Flash test: `fastboot boot boot.img`
              - Permanent flash: `fastboot flash boot boot.img`
            - **`Image.gz-dtb`**: Kernel binary with appended Nokia 6.1 DTB (`sdm630-nokia-pl2.dtb`).
            - **`Image.gz`**: Standalone compressed ARM64 kernel binary.
            - **`sdm630-nokia-pl2.dtb`**: Standalone compiled Device Tree Blob.
            - **`Nokia_PL2_Mainline-Kernel.zip`**: AnyKernel3 flashable package for recovery (TWRP/OrangeFox).
          files: |
            artifacts/boot.img
            artifacts/Image.gz-dtb
            artifacts/Image.gz
            artifacts/sdm630-nokia-pl2.dtb
            artifacts/Nokia_PL2_Mainline-Kernel.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
